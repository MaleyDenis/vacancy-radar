server.port=8080
anthropic.api.key=${ANTHROPIC_API_KEY:}

# How many days a scraped offer is kept in raw-offers.json before scan prunes it.
radar.offers.retention-days=30

# JustJoin listing filter by experience (comma-separated): intern, junior, mid, senior,
# team-leader-manager, c-level. Empty = all levels.
radar.justjoin.experience-levels=senior,team-leader-manager
